# Kết nối MySQL trên Railway (Thay thế thông tin Host, Port, Database, User và Password của bạn vào đây)
spring.datasource.url=jdbc:mysql://<mysql.railway.internal>:<3306>/<railway>?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=<root>
spring.datasource.password=<zPyyLQKgKRftWeOwotTTCmKAvpijLfvW>
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate và JPA cho MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cấu hình Static Resources & Upload file
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Đã tắt H2 Console vì chuyển sang MySQL trên Cloud
spring.h2.console.enabled=false