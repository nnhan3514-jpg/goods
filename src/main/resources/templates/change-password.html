<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - Bộ sưu tập Goods</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: url('/banner1.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5); z-index: 1;
        }
        .box {
            position: relative; z-index: 2;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px; border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%; max-width: 400px;
            box-sizing: border-box;
        }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #495057; font-weight: 600; }
        input {
            width: 100%; padding: 12px 14px; border: 1px solid #ced4da;
            border-radius: 8px; box-sizing: border-box; font-size: 14px;
        }
        button {
            width: 100%; background-color: #4CAF50; color: white;
            padding: 12px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px;
        }
        button:hover { background-color: #45a049; }
        .msg { text-align: center; margin-bottom: 15px; font-size: 14px; font-weight: 500; }
        .error { color: #e74c3c; }
        .success { color: #27ae60; }
        .back-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .back-link a { color: #4CAF50; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="box">
    <h2>Đổi mật khẩu</h2>
    <div th:if="${error}" class="msg error" th:text="${error}"></div>
    <div th:if="${success}" class="msg success" th:text="${success}"></div>

    <form th:action="@{/collection/change-password}" method="post">
        <div class="form-group">
            <label>Mật khẩu cũ</label>
            <input type="password" name="oldPassword" placeholder="Nhập mật khẩu cũ..." required />
        </div>
        <div class="form-group">
            <label>Mật khẩu mới</label>
            <input type="password" name="newPassword" placeholder="Nhập mật khẩu mới..." required />
        </div>
        <button type="submit">Cập nhật mật khẩu</button>
    </form>

    <div class="back-link">
        <a th:href="@{/collection}">← Quay lại</a>
    </div>
</div>
</body>
</html>
